name: FlakeShield Runtime Validation
on: [pull_request, push]

jobs:
  validate-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests and generate JUnit XML
        run: pytest --junitxml=junit.xml || true # || true ensures the workflow continues

      - name: Run FlakeShield Action
        uses: deeoli/flakeshield-scratch@feature/config-layer # Point to your current branch
        with:
          reports: "junit.xml"
          enable_semantic: "true"
          warn_on_high: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         - name: Upload FlakeShield artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flakeshield-report
          path: |
            outputs/flake_report.json
            outputs/flake_report.md
            outputs/flakeshield.db

      - name: Generate PR Summary Markdown
        if: github.event_name == 'pull_request'
        run: |
          flakeshield pr-summary --json outputs/flake_report.json --out outputs/pr_comment.md

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- flakeshield-report -->';

            if (!fs.existsSync('outputs/pr_comment.md')) {
              console.log("No PR summary file found.");
              return;
            }

            const body = fs.readFileSync('outputs/pr_comment.md', 'utf8');
            const fullBody = marker + "\n" + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }