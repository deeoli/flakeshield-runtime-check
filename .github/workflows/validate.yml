name: FlakeShield Runtime Validation

on: [pull_request, push]

jobs:
  validate-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Assert test files exist
        run: |
          test -f outputs/junit_run1.xml || (echo "Missing first XML report!" && exit 1)
          test -f outputs/junit_run2.xml || (echo "Missing second XML report!" && exit 1)

      - name: Run tests and generate JUnit XML files
        run: |
          mkdir -p outputs
          pytest tests/test_sample.py --junitxml=outputs/junit_run1.xml || true
          pytest tests/test_sample.py --junitxml=outputs/junit_run2.xml || true

      - name: Run FlakeShield Action
        uses: deeoli/flakeshield-scratch@feature/config-layer
        with:
          reports: "outputs/junit_run*.xml"
          enable_semantic: "true"
          warn_on_high: "true"

      - name: Upload FlakeShield artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flakeshield-report
          path: |
            outputs/flake_report.json
            outputs/flake_report.md
            outputs/flakeshield.db