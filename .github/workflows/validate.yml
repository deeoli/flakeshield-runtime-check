name: FlakeShield Runtime Validation
on: [pull_request, push]

jobs:
  validate-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests and generate JUnit XML
        run: pytest --junitxml=junit.xml || true # || true ensures the workflow continues

      - name: Run FlakeShield Action
        uses: deeoli/flakeshield-scratch@week-4-improve-data-schema # Point to your current branch
        with:
          reports: "junit.xml"
          enable_semantic: "true"
          warn_on_high: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}